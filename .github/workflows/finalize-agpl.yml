name: Finalize canonical AGPL license

on:
  push:
    branches:
      - release/v0.1.0-public
    paths:
      - .github/workflows/finalize-agpl.yml

permissions:
  contents: write

jobs:
  finalize-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate canonical GNU AGPL v3 text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://www.gnu.org/licenses/agpl-3.0.txt \
            --output LICENSE.new
          test "$(wc -c < LICENSE.new)" -gt 30000
          grep -Fq 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE.new
          grep -Fq 'Version 3, 19 November 2007' LICENSE.new
          grep -Fq 'Everyone is permitted to copy and distribute verbatim copies' LICENSE.new
          grep -Fq 'END OF TERMS AND CONDITIONS' LICENSE.new
          mv LICENSE.new LICENSE
          sha256sum LICENSE

      - name: Commit canonical license and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE
          git rm -- .github/workflows/finalize-agpl.yml
          git diff --cached --check
          git commit -m 'Add canonical GNU AGPL v3 license text'
          git push origin "HEAD:${GITHUB_REF_NAME}"
