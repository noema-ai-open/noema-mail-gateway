name: Build NOEMA TV Speed Limiter

on:
  push:
    branches:
      - build/noema-tv-speed-limiter
    paths:
      - 'noema-tv-speed-limiter-src.tgz'
      - '.github/workflows/build-noema-tv-speed-limiter.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: tar -xzf noema-tv-speed-limiter-src.tgz

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable release APK
        working-directory: noema-tv-speed-limiter
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noema-tv-speed-limiter-0.1.0-alpha1
          path: noema-tv-speed-limiter/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
