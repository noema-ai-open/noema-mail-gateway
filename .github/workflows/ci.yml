name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks against full history
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --log-opts="--all" --redact \
            --config=/repo/.gitleaks.toml \
            --report-format=json --report-path=/repo/gitleaks-report.json \
            --exit-code=1
      - name: Ensure a report file exists
        if: always()
        shell: bash
        run: test -f gitleaks-report.json || printf '[]\n' > gitleaks-report.json
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: error
      - name: Fail when Gitleaks found a reportable finding
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: pytest --junitxml="pytest-${{ matrix.python-version }}.xml"
      - name: Upload Pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
      - name: Fail when Pytest failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel installs in a clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/noema-wheel-test
          /tmp/noema-wheel-test/bin/pip install dist/*.whl
          /tmp/noema-wheel-test/bin/noema-mail-gateway --help >/tmp/noema-help.txt 2>&1 || test $? -eq 1
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: noema-mail-gateway-dist
          path: dist/*
          if-no-files-found: error