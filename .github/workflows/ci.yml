name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel installs in a clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/noema-wheel-test
          /tmp/noema-wheel-test/bin/pip install dist/*.whl
          /tmp/noema-wheel-test/bin/noema-mail-gateway --help >/tmp/noema-help.txt 2>&1 || test $? -eq 1
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: noema-mail-gateway-dist
          path: dist/*
          if-no-files-found: error