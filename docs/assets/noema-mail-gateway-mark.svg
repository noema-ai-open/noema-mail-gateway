<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NOEMA Mail Gateway mark</title>
  <desc id="desc">A blue rounded-square mail gateway symbol with a secure keyhole.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a4a"/>
      <stop offset="1" stop-color="#03102f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1597ff"/>
      <stop offset="1" stop-color="#0757c9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="78" y="82" width="356" height="348" rx="44" fill="url(#panel)" stroke="#2eb7ff" stroke-width="8" filter="url(#glow)"/>
  <path d="M112 145h288v166H112z" fill="#072b70" stroke="#39c2ff" stroke-width="6"/>
  <path d="M116 151l140 108 140-108" fill="none" stroke="#c5f4ff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 306l92-78M392 306l-92-78" fill="none" stroke="#66d8ff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="345" r="58" fill="#041538" stroke="#48d5ff" stroke-width="7"/>
  <circle cx="256" cy="330" r="16" fill="#ecfeff"/>
  <path d="M248 342h16l10 34h-36z" fill="#ecfeff"/>
</svg>
